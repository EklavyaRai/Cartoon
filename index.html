<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Childhood - Cartoon Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <div class="logo">Child<span>hood</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search cartoons or genres..." onkeyup="handleSearch()">
        </div>
    </header>

    <!-- Main Layout Container -->
    <div class="main-layout">
        <!-- Vertical Tab Navigation -->
        <aside class="sidebar">
            <button class="tab-btn active" onclick="switchTab(event, 'popular')">
                <span>🔥</span> Popular Cartoons
            </button>
            <button class="tab-btn" onclick="switchTab(event, 'cartoon-network')">
                <span>📺</span> Cartoon Network
            </button>
            <button class="tab-btn" onclick="switchTab(event, 'nickelodeon')">
                <span>🍊</span> Nickelodeon
            </button>
            <button class="tab-btn" onclick="switchTab(event, 'disney')">
                <span>🏰</span> Disney
            </button>
        </aside>

        <!-- Dynamic Content Area -->
        <section class="content-area">
            <div id="tabTitle" class="section-title">Popular Cartoons of All Time</div>
            <div class="cartoon-grid" id="cartoonGrid"></div>
        </section>
    </div>

    <!-- Video Player Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="playerTitle">Now Playing</h2>
            <div class="video-container">
                <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
