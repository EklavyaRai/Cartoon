<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Childhood - Watch Cartoons Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo">Child<span>hood</span></div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search cartoon or type..." onkeyup="filterCartoons()">
        </div>
    </header>

    <!-- Main Hero Banner -->
    <section class="hero">
        <div class="hero-content">
            <h1>Unlimited Cartoons</h1>
            <p>Watch your favorite animated classics and modern shows anywhere, anytime.</p>
        </div>
    </section>

    <!-- Video Modal Player -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <h2 id="playerTitle">Now Playing</h2>
            <div class="video-container">
                <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Main Gallery Section -->
    <main class="container">
        <!-- Channel Filter Tabs -->
        <div class="channel-tabs">
            <button class="tab-btn active" onclick="filterByChannel('All', this)">Popular Cartoons of All Time</button>
            <button class="tab-btn" onclick="filterByChannel('Cartoon Network', this)">Cartoon Network</button>
            <button class="tab-btn" onclick="filterByChannel('Nickelodeon', this)">Nickelodeon</button>
            <button class="tab-btn" onclick="filterByChannel('Disney', this)">Disney</button>
        </div>

        <h2 id="sectionTitle">Popular Cartoons of All Time</h2>

        <!-- Horizontal Slider -->
        <div class="slider-wrapper">
            <button class="slider-btn left-btn" onclick="slideLeft()">&#10094;</button>
            <div class="card-slider" id="cartoonGrid">
                <!-- Cards generated via JavaScript -->
            </div>
            <button class="slider-btn right-btn" onclick="slideRight()">&#10095;</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Childhood. Web Concept Design.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
